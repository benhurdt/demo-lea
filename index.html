<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0e1a">
<title>Léa — Secretária Virtual · Advocacia</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e1a;--surface:#0f1420;--surface2:#141928;--surface3:#1a2035;
  --border:#1e2540;--border2:#252d48;
  --text:#e8ecf4;--text2:#7a849e;--text3:#3d4560;
  --azul:#3b7ae8;--azul2:#5b9af0;
  --azul-bg:rgba(59,122,232,.08);--azul-bd:rgba(59,122,232,.25);
  --ouro:#c9a84c;--ouro2:#e4c06a;
  --ouro-bg:rgba(201,168,76,.08);--ouro-bd:rgba(201,168,76,.2);
  --verde:#22c55e;--verde-bg:rgba(34,197,94,.08);
  --verm:#f87171;--verm-bg:rgba(248,113,113,.08);
  --r:10px;--rlg:16px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:'Inter',sans-serif;color:var(--text);font-size:14px}

/* ── CONFIG ── */
.config-screen{
  position:fixed;inset:0;background:var(--bg);z-index:500;
  display:flex;align-items:center;justify-content:center;padding:24px;
}
.config-card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--rlg);padding:28px;width:100%;max-width:380px;
}
.config-logo{font-size:28px;margin-bottom:6px;text-align:center}
.config-titulo{font-size:17px;font-weight:700;text-align:center;margin-bottom:4px}
.config-sub{
  font-size:12px;color:var(--text2);text-align:center;
  margin-bottom:22px;line-height:1.5;
}
.config-field{margin-bottom:14px}
.config-field label{
  font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.1em;color:var(--text3);display:block;margin-bottom:5px;
}
.config-field input{
  width:100%;background:var(--surface2);border:1px solid var(--border);
  border-radius:var(--r);padding:10px 13px;color:var(--text);
  font-family:'Inter',sans-serif;font-size:13px;outline:none;
  transition:border-color .2s;
}
.config-field input:focus{border-color:var(--azul-bd)}
.config-field input::placeholder{color:var(--text3);font-size:12px}
.btn-config{
  width:100%;background:var(--azul);color:#fff;border:none;
  border-radius:var(--r);padding:12px;font-family:'Inter',sans-serif;
  font-weight:700;font-size:14px;cursor:pointer;margin-top:6px;
  transition:opacity .15s;
}
.btn-config:hover{opacity:.88}
.config-link{
  font-size:11px;color:var(--text3);text-align:center;
  margin-top:12px;line-height:1.5;
}
.config-link a{color:var(--azul2);text-decoration:none}

/* ── TELA PRINCIPAL ── */
.screen{
  width:100%;max-width:420px;height:100vh;
  margin:0 auto;display:flex;flex-direction:column;
  background:var(--bg);
}

/* STATUS BAR */
.status-bar{
  background:var(--surface);padding:8px 16px 6px;
  display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.status-time{font-size:12px;font-weight:600}
.status-icons{font-size:11px;color:var(--text2);display:flex;gap:6px}

/* CHAT HEADER */
.chat-hdr{
  background:var(--surface);padding:10px 14px;
  display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--border);flex-shrink:0;
}
.avatar{
  width:40px;height:40px;border-radius:50%;
  background:linear-gradient(135deg,#1d4ed8,#3b7ae8);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;flex-shrink:0;position:relative;
}
.avatar-online{
  position:absolute;bottom:1px;right:1px;
  width:10px;height:10px;border-radius:50%;
  background:var(--verde);border:2px solid var(--surface);
}
.hdr-info{flex:1;min-width:0}
.hdr-nome{font-size:15px;font-weight:600}
.hdr-status{font-size:11px;color:var(--verde)}
.hdr-sub{font-size:10px;color:var(--text3);margin-top:1px}
.hdr-cfg{
  background:none;border:none;color:var(--text3);
  font-size:18px;cursor:pointer;padding:4px;transition:color .15s;
}
.hdr-cfg:hover{color:var(--azul2)}

/* BANNER DEMO */
.demo-banner{
  background:linear-gradient(135deg,var(--azul-bg),rgba(59,122,232,.04));
  border-bottom:1px solid var(--azul-bd);
  padding:7px 14px;display:flex;align-items:center;gap:8px;flex-shrink:0;
}
.demo-banner-txt{font-size:11px;color:var(--azul2);flex:1;line-height:1.4}
.demo-banner-txt strong{font-weight:700}
.demo-reset{
  background:var(--azul-bg);border:1px solid var(--azul-bd);
  color:var(--azul2);font-size:10px;font-family:'Inter',sans-serif;
  padding:4px 10px;border-radius:12px;cursor:pointer;white-space:nowrap;
}

/* CHAT BODY */
.chat-body{
  flex:1;overflow-y:auto;padding:10px 12px 6px;
  display:flex;flex-direction:column;gap:3px;scroll-behavior:smooth;
}
.chat-body::-webkit-scrollbar{width:3px}
.chat-body::-webkit-scrollbar-thumb{background:var(--border2)}

.date-sep{text-align:center;margin:8px 0}
.date-sep span{
  background:var(--surface2);font-size:11px;color:var(--text3);
  padding:3px 12px;border-radius:12px;
}

/* MENSAGENS */
.msg-wrap{display:flex;flex-direction:column;margin-bottom:2px}
.msg-wrap.out{align-items:flex-end}
.msg-wrap.in{align-items:flex-start}
.msg{
  max-width:84%;padding:8px 11px 6px;border-radius:var(--r);
  font-size:14px;line-height:1.55;word-break:break-word;
}
.msg.in{background:var(--surface2);border-bottom-left-radius:3px;color:var(--text)}
.msg.out{background:#1a3a5c;border-bottom-right-radius:3px;color:#e8f4ff}
.msg-hora{
  font-size:10px;opacity:.5;text-align:right;margin-top:3px;
  display:flex;align-items:center;justify-content:flex-end;gap:3px;
}
.msg-tick{color:#53bdeb;font-size:11px}
.msg strong{font-weight:600}
.msg em{font-style:italic;opacity:.8}

/* TYPING */
.typing-wrap{
  display:none;align-items:flex-start;gap:8px;
  margin:4px 12px;flex-shrink:0;
}
.typing-wrap.show{display:flex}
.typing-av{
  width:28px;height:28px;border-radius:50%;
  background:linear-gradient(135deg,#1d4ed8,#3b7ae8);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;flex-shrink:0;
}
.typing-bubble{
  background:var(--surface2);border-radius:var(--r) var(--r) var(--r) 3px;
  padding:10px 14px;display:flex;gap:4px;align-items:center;
}
.typing-dot{
  width:6px;height:6px;border-radius:50%;background:var(--text3);
  animation:typAnim 1.2s infinite;
}
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes typAnim{
  0%,60%,100%{transform:translateY(0);background:var(--text3)}
  30%{transform:translateY(-5px);background:var(--azul2)}
}

/* SUGESTÕES */
.sugestoes{
  padding:6px 10px 4px;display:flex;gap:5px;flex-wrap:wrap;
  background:var(--surface);border-top:1px solid var(--border);flex-shrink:0;
}
.sug-btn{
  background:var(--surface2);border:1px solid var(--border2);
  color:var(--text2);font-size:12px;font-family:'Inter',sans-serif;
  padding:6px 11px;border-radius:16px;cursor:pointer;
  transition:all .15s;white-space:nowrap;
}
.sug-btn:hover{
  background:var(--azul-bg);border-color:var(--azul-bd);color:var(--azul2);
}

/* INPUT */
.chat-input-wrap{
  background:var(--surface);padding:8px 10px;
  border-top:1px solid var(--border);
  display:flex;align-items:flex-end;gap:8px;flex-shrink:0;
}
.input-box{
  flex:1;background:var(--surface2);border:1px solid var(--border);
  border-radius:22px;padding:9px 14px;color:var(--text);
  font-family:'Inter',sans-serif;font-size:14px;
  outline:none;resize:none;max-height:120px;line-height:1.4;
  transition:border-color .2s;
}
.input-box:focus{border-color:var(--azul-bd)}
.input-box::placeholder{color:var(--text3)}
.send-btn{
  width:42px;height:42px;border-radius:50%;
  background:var(--azul);border:none;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:18px;transition:all .15s;flex-shrink:0;
}
.send-btn:hover{background:var(--azul2)}
.send-btn:disabled{background:var(--surface3);cursor:default}

/* TOAST */
.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--text);color:var(--bg);font-size:12px;font-weight:700;
  padding:8px 18px;border-radius:20px;z-index:999;
  opacity:0;transition:opacity .3s;pointer-events:none;
}
.toast.show{opacity:1}
</style>
</head>
<body>

<!-- TELA DE CONFIGURAÇÃO (oculta na demo pública) -->
<div class="config-screen" id="config-screen" style="display:none">
  <div class="config-card">
    <div class="config-logo">⚖️</div>
    <div class="config-titulo">Léa — Demo</div>
    <input id="cfg-key" type="hidden" value="">
    <input id="cfg-adv" type="hidden" value="Dr. Carlos Mendes">
    <input id="cfg-esp" type="hidden" value="Advocacia Civil e Trabalhista">
    <input id="cfg-cidade" type="hidden" value="Osório RS">
  </div>
</div>

<!-- TELA DO CHAT -->
<div class="screen" id="app" style="display:none">

  <div class="status-bar">
    <div class="status-time" id="status-time">9:41</div>
    <div class="status-icons"><span>●●●●</span><span>WiFi</span><span>🔋</span></div>
  </div>

  <div class="demo-banner">
    <span style="font-size:15px">⚖️</span>
    <div class="demo-banner-txt">
      <strong>Léa v2 — Secretária IA</strong> · Powered by Groq + Llama 3
    </div>
    <button class="demo-reset" onclick="resetarDemo()">↺ Reiniciar</button>
  </div>

  <div class="chat-hdr">
    <div class="avatar">⚖️<div class="avatar-online"></div></div>
    <div class="hdr-info">
      <div class="hdr-nome" id="hdr-nome">Léa · Dr. Carlos Mendes</div>
      <div class="hdr-status">online agora</div>
      <div class="hdr-sub" id="hdr-sub">Secretária virtual · Advocacia</div>
    </div>
    <button class="hdr-cfg" onclick="resetarDemo()" title="Reiniciar demo">↺</button>
  </div>

  <div class="chat-body" id="chat-body">
    <div class="date-sep"><span>Hoje</span></div>
  </div>

  <div class="typing-wrap" id="typing">
    <div class="typing-av">⚖️</div>
    <div class="typing-bubble">
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
      <div class="typing-dot"></div>
    </div>
  </div>

  <div class="sugestoes" id="sugestoes"></div>

  <div class="chat-input-wrap">
    <textarea class="input-box" id="chat-input" placeholder="Mensagem..." rows="1"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();enviar()}"
      oninput="ajustarAltura(this)"></textarea>
    <button class="send-btn" id="send-btn" onclick="enviar()">➤</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/*
╔══════════════════════════════════════════════════════════════╗
║  LÉA v2 — SECRETÁRIA VIRTUAL · ARQUITETURA DE AGENTE        ║
║                                                              ║
║  Mesma arquitetura da Bia v2:                                ║
║  1. MEMÓRIA   — histórico completo da conversa               ║
║  2. CONTEXTO  — dados do escritório centralizados            ║
║  3. CÉREBRO   — Groq/Llama decide a ação                    ║
║  4. PROMPT    — regras em linguagem natural                  ║
╚══════════════════════════════════════════════════════════════╝
*/

// ── CONFIGURAÇÃO ──────────────────────────────────────────────
let CFG = {
  key: '',
  advogado: 'Dr. Carlos Mendes',
  especialidade: 'Advocacia Civil e Trabalhista',
  cidade: 'Osório RS',
};

// ── MEMÓRIA DA CONVERSA ───────────────────────────────────────
let MEMORIA = [];
let enviando = false;

// ── DADOS DO ESCRITÓRIO ───────────────────────────────────────
function dadosEscritorio(){
  const agora = new Date();
  const dias = ['domingo','segunda-feira','terça-feira','quarta-feira',
                'quinta-feira','sexta-feira','sábado'];
  const meses = ['janeiro','fevereiro','março','abril','maio','junho',
                 'julho','agosto','setembro','outubro','novembro','dezembro'];
  const diaAtual  = dias[agora.getDay()];
  const dataAtual = agora.getDate()+' de '+meses[agora.getMonth()]+' de '+agora.getFullYear();
  const horaAtual = agora.getHours().toString().padStart(2,'0')+':'+
                    agora.getMinutes().toString().padStart(2,'0');

  // Horários disponíveis — filtra os que ainda não passaram hoje
  const todosHorarios = ['09:00','10:30','14:00','15:30','17:00'];
  const horariosHoje = todosHorarios.filter(h => {
    const [hh,mm] = h.split(':').map(Number);
    return hh > agora.getHours() ||
          (hh === agora.getHours() && mm > agora.getMinutes());
  });

  return {
    advogado:     CFG.advogado,
    especialidade:CFG.especialidade,
    cidade:       CFG.cidade,
    endereco:     'Av. Borges de Medeiros, 456 — Centro, '+CFG.cidade,
    horario:      'Segunda a sexta, das 9h às 18h',
    consulta:     'R$ 250',
    pagamento:    'Pix, cartão de débito, cartão de crédito e dinheiro',
    tel_humano:   '(51) 98228-0117',
    wpp_humano:   '5551982280117',
    areas: `
      - Direito Trabalhista: demissão, rescisão, FGTS, horas extras, assédio
      - Direito de Família: divórcio, pensão alimentícia, guarda, inventário
      - Contratos: elaboração, revisão, rescisão contratual
      - Cobrança e Dívidas: negativação, acordos, execução de dívidas
      - Outras áreas: consulte disponibilidade`,
    diaAtual, dataAtual, horaAtual,
    horariosHoje: horariosHoje.length
      ? horariosHoje.join(', ')
      : 'nenhum horário disponível hoje',
    todosHorarios: todosHorarios.join(', '),
  };
}

// ── PROMPT DO SISTEMA ─────────────────────────────────────────
function buildSystemPrompt(){
  const e = dadosEscritorio();
  return `Você é a Léa, secretária virtual do escritório de advocacia ${e.advogado} — ${e.especialidade}, ${e.cidade}.

DATA E HORA ATUAL: ${e.dataAtual}, ${e.diaAtual}, ${e.horaAtual}.
HORÁRIOS DISPONÍVEIS HOJE: ${e.horariosHoje}
HORÁRIOS EM OUTROS DIAS: ${e.todosHorarios}

INFORMAÇÕES DO ESCRITÓRIO:
- Endereço: ${e.endereco}
- Horário de atendimento: ${e.horario}
- Valor da consulta inicial: ${e.consulta}
- Formas de pagamento: ${e.pagamento}
- WhatsApp direto: ${e.tel_humano}

ÁREAS DE ATUAÇÃO:
${e.areas}

REGRAS OBRIGATÓRIAS — siga SEMPRE sem exceção:

1. VOCÊ É SECRETÁRIA: Não dê orientação jurídica nem opine sobre o mérito do caso. Apenas recepcione, colete dados e agende.

2. ORDEM DE COLETA — siga EXATAMENTE esta sequência antes de confirmar:
   a) Cumprimente e pergunte o nome
   b) Pergunte a área do direito ou situação
   c) Peça descrição breve do caso (2-3 linhas)
   d) Ofereça datas disponíveis e confirme o DIA
   e) Ofereça horários e confirme o HORÁRIO
   f) Peça o telefone com DDD (mínimo 8 dígitos)
   g) Apresente o resumo completo e peça confirmação (sim/não)
   h) SÓ APÓS "sim" → mostre o bloco ✅ de confirmação
   NUNCA pule etapas. NUNCA mostre ✅ antes de ter todos os dados confirmados.

3. HORÁRIOS POR EXTENSO — interprete SEMPRE considerando contexto de salão/escritório (horário comercial):
   - "9", "nove", "9 da manhã" = 09:00
   - "10", "dez", "10 e meia" = 10:30
   - "2", "duas", "2 da tarde" = 14:00
   - "3", "três", "3 da tarde" = 15:30
   - "4", "quatro", "4 da tarde" = 17:00 (mais próximo disponível)
   - "5", "cinco", "5 da tarde", "umas 5" = 17:00
   - "4 e meia", "quatro e meia" = 17:00 (mais próximo)
   - Números entre 1 e 9 sem especificação = período da tarde
   - Confirme sempre o horário exato antes de avançar

4. DATAS: Hoje é ${e.dataAtual}. São ${e.horaAtual}.
   - NUNCA ofereça horários já passados hoje
   - Se hoje não houver horários, ofereça o próximo dia útil
   - Sempre confirme o DIA antes de confirmar o HORÁRIO

5. TELEFONE: Aceite apenas números com pelo menos 8 dígitos. Formatos aceitos: 51988886666, (51) 98888-6666, 051 98888-6666.

6. RESPOSTAS FREQUENTES — responda imediatamente em qualquer momento:
   - Valores: ${e.consulta}
   - Endereço: ${e.endereco}
   - Horários: ${e.horario}
   - Pagamento: ${e.pagamento}
   Após responder, retome o ponto do fluxo onde estava.

7. URGÊNCIAS: Para preso, flagrante, acidente, delegacia → passe imediatamente: ${e.tel_humano}

8. MENSAGENS CURTAS: Máximo 4 linhas por mensagem. Uma pergunta por vez. Não acumule perguntas.

9. CONFIRMAÇÃO PREMATURA PROIBIDA: NUNCA mostre o bloco ✅ no meio da conversa. Só mostre quando o cliente responder "sim" ao resumo final.

10. FORMATO DE CONFIRMAÇÃO — use EXATAMENTE após o "sim" do cliente:
✅ *Consulta agendada!*
👤 *Cliente:* [nome completo]
⚖️ *Assunto:* [área — descrição breve]
📅 *Data:* [dia da semana, DD/MM/AAAA]
🕐 *Horário:* [horário]
📱 *Telefone:* [telefone]
💰 *Consulta:* ${e.consulta}
📍 *Local:* ${e.endereco}

11. PÓS-AGENDAMENTO: Após o bloco ✅, informe apenas que um lembrete será enviado no dia anterior e encerre cordialmente. Não faça mais perguntas.`;
}

// ── GROQ API ──────────────────────────────────────────────────
async function chamarGroq(mensagemUsuario){
  MEMORIA.push({role:'user', content: mensagemUsuario});
  const historico = MEMORIA.slice(-20);

  const response = await fetch('https://api.groq.com/openai/v1/chat/completions',{
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'Authorization':'Bearer '+CFG.key,
    },
    body: JSON.stringify({
      model: 'llama-3.1-8b-instant',
      messages:[
        {role:'system', content: buildSystemPrompt()},
        ...historico,
      ],
      temperature: 0.6,
      max_tokens: 400,
      stream: false,
    })
  });

  if(!response.ok){
    const err = await response.json();
    throw new Error(err.error?.message || 'Erro na API Groq');
  }

  const data = await response.json();
  const resposta = data.choices?.[0]?.message?.content || '';
  MEMORIA.push({role:'assistant', content: resposta});
  return resposta;
}

// ── RENDERIZAÇÃO ──────────────────────────────────────────────
function horaStr(){
  const n = new Date();
  return n.getHours().toString().padStart(2,'0')+':'+
         n.getMinutes().toString().padStart(2,'0');
}

function addMsg(texto, tipo){
  const body = document.getElementById('chat-body');
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap '+tipo;
  const tick = tipo==='out'?'<span class="msg-tick">✓✓</span>':'';
  const html = texto
    .replace(/\*([^*]+)\*/g,'<strong>$1</strong>')
    .replace(/\n/g,'<br>');
  wrap.innerHTML = `<div class="msg ${tipo}">${html}
    <div class="msg-hora">${horaStr()}${tick}</div></div>`;
  body.appendChild(wrap);
  body.scrollTop = body.scrollHeight;
}

function mostrarTyping(show){
  document.getElementById('typing').classList.toggle('show', show);
  if(show){
    const body = document.getElementById('chat-body');
    body.scrollTop = body.scrollHeight;
  }
}

function mostrarSugestoes(lista){
  const el = document.getElementById('sugestoes');
  if(!lista||!lista.length){ el.innerHTML=''; return; }
  el.innerHTML = lista.map(s=>
    `<button class="sug-btn" onclick="usarSug(this)">${s}</button>`
  ).join('');
}

function usarSug(el){
  document.getElementById('chat-input').value = el.textContent;
  mostrarSugestoes([]);
  enviar();
}

function ajustarAltura(el){
  el.style.height='auto';
  el.style.height=Math.min(el.scrollHeight,120)+'px';
}

// ── ENVIAR MENSAGEM ───────────────────────────────────────────
async function enviar(){
  if(enviando) return;
  const input = document.getElementById('chat-input');
  const btn   = document.getElementById('send-btn');
  const texto = input.value.trim();
  if(!texto) return;

  enviando=true;
  input.disabled=true;
  btn.disabled=true;
  input.value='';
  input.style.height='auto';
  mostrarSugestoes([]);

  addMsg(texto,'out');
  mostrarTyping(true);

  try{
    const resposta = await chamarGroq(texto);
    mostrarTyping(false);
    addMsg(resposta,'in');

    // Sugestões contextuais
    if(/confirma|sim.*não|agend/i.test(resposta)){
      mostrarSugestoes(['Sim, confirmar','Não, cancelar']);
    } else if(/qual.*área|situação|assunto/i.test(resposta)){
      mostrarSugestoes(['Trabalhista','Família','Contratos','Cobrança']);
    } else if(/dia|data|prefere/i.test(resposta)){
      mostrarSugestoes(['Amanhã','Segunda-feira','Terça-feira']);
    } else if(/horário/i.test(resposta)){
      mostrarSugestoes(['09:00','10:30','14:00','15:30','17:00']);
    } else if(/telefone|contato/i.test(resposta)){
      mostrarSugestoes(['Prefiro não informar']);
    }

  } catch(err){
    mostrarTyping(false);
    addMsg('Desculpe, tive um problema técnico. Tente novamente em instantes.','in');
    console.error('Erro Groq:', err);
  } finally{
    enviando=false;
    input.disabled=false;
    btn.disabled=false;
    input.focus();
  }
}

// ── CONFIGURAÇÃO ──────────────────────────────────────────────
function salvarConfig(){
  const key     = document.getElementById('cfg-key').value.trim();
  const adv     = document.getElementById('cfg-adv').value.trim() || 'Dr. Carlos Mendes';
  const esp     = document.getElementById('cfg-esp').value.trim() || 'Advocacia Civil e Trabalhista';
  const cidade  = document.getElementById('cfg-cidade').value.trim() || 'Osório RS';

  if(!key || key.length < 20){
    toast('Cole sua chave Groq para continuar.');
    return;
  }

  CFG = {key, advogado:adv, especialidade:esp, cidade};
  localStorage.setItem('lea_v2_cfg', JSON.stringify(CFG));

  document.getElementById('hdr-nome').textContent = 'Léa · '+adv;
  document.getElementById('hdr-sub').textContent  = 'Secretária virtual · '+esp;

  document.getElementById('config-screen').style.display='none';
  document.getElementById('app').style.display='flex';
  iniciarDemo();
}

function abrirConfig(){
  document.getElementById('cfg-key').value    = CFG.key;
  document.getElementById('cfg-adv').value    = CFG.advogado;
  document.getElementById('cfg-esp').value    = CFG.especialidade;
  document.getElementById('cfg-cidade').value = CFG.cidade;
  document.getElementById('config-screen').style.display='flex';
  document.getElementById('app').style.display='none';
}

async function iniciarDemo(){
  MEMORIA = [];
  await sleep(600);
  mostrarTyping(true);
  await sleep(1200);
  mostrarTyping(false);
  const boas_vindas =
    `Olá! 😊 Bem-vindo ao escritório *${CFG.advogado}*.\n\nSou a *Léa*, secretária virtual do escritório. Posso agendar sua consulta, informar valores, horários e localização.\n\nComo posso te ajudar?`;
  addMsg(boas_vindas,'in');
  MEMORIA.push({role:'assistant', content: boas_vindas});
  mostrarSugestoes([
    'Quero agendar uma consulta',
    'Qual o valor da consulta?',
    'Onde fica o escritório?',
    'Quais áreas de atuação?',
  ]);
}

function resetarDemo(){
  const body = document.getElementById('chat-body');
  body.innerHTML='<div class="date-sep"><span>Hoje</span></div>';
  mostrarSugestoes([]);
  iniciarDemo();
}

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

// ── HORA DO STATUS BAR ────────────────────────────────────────
function atualizarHora(){
  const n=new Date();
  document.getElementById('status-time').textContent=
    n.getHours().toString().padStart(2,'0')+':'+
    n.getMinutes().toString().padStart(2,'0');
}
setInterval(atualizarHora,30000);
atualizarHora();

// ── TOAST ─────────────────────────────────────────────────────
function toast(msg,dur=2400){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),dur);
}
